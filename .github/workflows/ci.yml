name: CI

on:
  push:
    branches:
      - main
      - desandu
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: TypeScript Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Compiler Check
        run: npm run typecheck

  test:
    name: Database Migrations & Automated Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: kandypack_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      DATABASE_URL: mysql://root:rootpassword@127.0.0.1:3306/kandypack_test
      JWT_SECRET: ci-test-jwt-secret-minimum-32-characters-long
      UPSTASH_REDIS_REST_URL: https://mock-redis.upstash.io
      UPSTASH_REDIS_REST_TOKEN: mock-token
      BOOTSTRAP_ADMIN_PASSWORD: Admin@Kandypack2026!
      SEED_TEST_PASSWORD: Test@Kandypack2026!

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Pure Unit Tests
        run: npm run test:unit

      - name: Verify Clean Database Migrations (01→22)
        run: npm run db:migrate

      - name: Seed Baseline Master Data
        run: npm run db:seed

      - name: Run Integration Tests (Stored Procedures & DB Triggers)
        run: npm run test:integration

      - name: Run API Route Tests
        run: npm run test:api
