# Production deployment: build the Docker image in CI, push it to GitHub Container Registry (GHCR),
# then deploy it to the EC2 server over SSH.
#
# HOW IT RUNS
#   - Automatically, after the "CI" workflow (lint, typecheck, migrations, tests) finishes
#     successfully for a push to `main`. A failing CI never deploys. The release flow is:
#     PR into `development`, then merge `development` into `main`.
#   - Manually (Actions tab > Deploy > Run workflow) to ROLL BACK: set `image_tag` to the full
#     commit SHA of an already-built release. With `image_tag` empty a manual run does nothing.
#
# NOT DONE HERE: database migrations and seeding. They are deliberate manual steps because the
# production site shares its MySQL database with development (Docs/10_local-setup.md).
#
# REQUIRED SETUP (GitHub > Settings > Environments > "production" > Environment secrets):
#   EC2_HOST      public hostname or Elastic IP of the server
#   EC2_USER      the SSH user for deployments (deploy)
#   EC2_SSH_KEY   private half of the dedicated deploy key (never the personal .pem)
#   EC2_HOST_KEY  the server's host key line from `ssh-keyscan -t ed25519 <host>`, so the runner
#                 verifies it is talking to the real server instead of trusting the first answer
# The server pulls the image with this job's short-lived GITHUB_TOKEN, so no long-lived registry
# token is stored anywhere.
#
# Authority: Docs/03_architecture.md §12 (CI/CD), docker-compose.prod.yml, Caddyfile.

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Roll back: deploy an existing image tag (full commit SHA). Leave empty to skip."
        required: false
        type: string

# Only one deployment may run at a time, and a running deployment is never cancelled midway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Public URL used by the post-deploy smoke test.
  SITE_URL: https://dinethnimsara.dpdns.org
  # Directory on the server that holds docker-compose.prod.yml, Caddyfile, .env and app.env.
  REMOTE_DIR: /opt/kandypack

jobs:
  # -------------------------------------------------------------------------------------------
  # Job 1: build the image and push it to GHCR (automatic runs only).
  # -------------------------------------------------------------------------------------------
  build:
    name: Build and push image
    # Run only for a successful CI run that was triggered by a push to main (not for pull requests).
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout the exact commit CI approved
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Work out the image name and tag
        id: meta
        run: |
          # GHCR requires a lower-case repository path.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The commit SHA is the immutable release tag used for rollbacks; `latest` is a convenience.
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          # Reuse layers between runs so dependency installs are not repeated.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------------------------
  # Job 2: deploy the image to the EC2 server over SSH.
  # -------------------------------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    needs: build
    # Run after a successful build, or for a manual rollback (where `build` is skipped).
    if: >-
      always() && (
        needs.build.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.image_tag != '' && needs.build.result == 'skipped')
      )
    runs-on: ubuntu-latest
    # The `production` environment holds the SSH secrets and can require a manual approval.
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4
        with:
          # Deploy the compose file and Caddyfile that belong to the release being deployed.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve the image to deploy
        id: image
        env:
          # Passed through the environment (not interpolated into the script) so a crafted
          # `image_tag` value can never be executed as shell code.
          INPUT_TAG: ${{ inputs.image_tag }}
          BUILT_IMAGE: ${{ needs.build.outputs.image }}
          BUILT_TAG: ${{ needs.build.outputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$INPUT_TAG"
          else
            IMAGE="$BUILT_IMAGE:$BUILT_TAG"
          fi
          echo "Deploying $IMAGE"
          echo "ref=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH access
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST_KEY: ${{ secrets.EC2_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          # The private key and pinned host key exist only on this ephemeral runner.
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts

      - name: Copy compose file and Caddyfile to the server
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER_NAME: ${{ secrets.EC2_USER }}
        run: |
          # StrictHostKeyChecking=yes aborts if the server's key differs from the pinned one.
          scp -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            docker-compose.prod.yml Caddyfile "$USER_NAME@$HOST:$REMOTE_DIR/"

      - name: Pull and restart the stack (rolls back automatically if unhealthy)
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER_NAME: ${{ secrets.EC2_USER }}
          APP_IMAGE: ${{ steps.image.outputs.ref }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The remote script is sent over stdin so the registry token never appears in a process
          # argument list. The first line exports the values; the quoted heredoc below is the
          # script itself and is not expanded by this runner's shell.
          {
            printf 'export REMOTE_DIR=%q APP_IMAGE=%q GHCR_USER=%q GHCR_TOKEN=%q\n' \
              "$REMOTE_DIR" "$APP_IMAGE" "$GHCR_USER" "$GHCR_TOKEN"
            cat <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_DIR"
          COMPOSE="docker compose -f docker-compose.prod.yml"

          # Remember the image that is running now so we can go back to it if the new one fails.
          PREVIOUS=""
          if [ -f .env ]; then PREVIOUS=$(grep '^APP_IMAGE=' .env | cut -d= -f2- || true); fi

          # Log in with the job's short-lived token, pull, then log out again.
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          printf 'APP_IMAGE=%s\n' "$APP_IMAGE" > .env
          $COMPOSE pull
          $COMPOSE up -d --remove-orphans
          docker logout ghcr.io

          # Wait up to ~2 minutes for the app container's health check to pass.
          HEALTHY=no
          for i in $(seq 1 24); do
            STATUS=$(docker inspect --format '{{.State.Health.Status}}' "$($COMPOSE ps -q app)" 2>/dev/null || echo starting)
            echo "app health: $STATUS"
            if [ "$STATUS" = "healthy" ]; then HEALTHY=yes; break; fi
            sleep 5
          done

          if [ "$HEALTHY" != "yes" ]; then
            echo "New release did not become healthy. Recent app logs:"
            $COMPOSE logs --tail 50 app || true
            if [ -n "$PREVIOUS" ]; then
              echo "Rolling back to $PREVIOUS"
              printf 'APP_IMAGE=%s\n' "$PREVIOUS" > .env
              $COMPOSE up -d --remove-orphans
            fi
            exit 1
          fi

          # Delete images no container uses any more so the disk does not fill up.
          docker image prune -f
          REMOTE
          } | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
                "$USER_NAME@$HOST" 'bash -s'

      - name: Smoke test the public site
        run: |
          # Retry for a short while because Caddy may need a moment on the very first certificate.
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors \
            --output /dev/null "$SITE_URL/login"
          echo "Site is up: $SITE_URL"
